{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Kounter | Password Changed</title>

    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --success-bg: rgba(5, 150, 105, 0.10);
            --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        }

        html[data-theme="dark"] {
            --bg: #0b1120;
            --card: #111827;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #263244;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.10);
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 38px 34px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .brand {
            margin-bottom: 28px;
        }

        .brand img {
            width: 150px;
            max-width: 70%;
            border-radius: 12px;
        }

        .logo-dark {
            display: none;
        }

        html[data-theme="dark"] .logo-light {
            display: none;
        }

        html[data-theme="dark"] .logo-dark {
            display: inline-block;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: var(--success-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        p {
            margin: 0 auto;
            max-width: 350px;
            color: var(--muted);
            line-height: 1.65;
            font-size: 14px;
        }

        .button {
            display: block;
            margin-top: 28px;
            padding: 14px 20px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .button:hover {
            background: var(--primary-hover);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 30px 22px;
            }
        }
    </style>


</head>

<body>

    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">

        ☀️


    </button>

    <div class="page">


        <div class="card">

            <div class="brand">

                <img src="{% static 'core/Kounter_light.jpg' %}" alt="Kounter" class="logo-light">

                <img src="{% static 'core/Kounter_dark.jpg' %}" alt="Kounter" class="logo-dark">

            </div>

            <div class="icon">
                ✓
            </div>

            <h1>Password Changed</h1>

            <p>
                Your Kounter password has been successfully changed.
                You can now sign in using your new password.
            </p>

            <a href="{% url 'login' %}" class="button">
                Sign In
            </a>

        </div>


    </div>

    <script>
        const THEME_KEY = "kounter-theme";

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);

            const button = document.getElementById("themeToggle");

            if (button) {
                button.textContent = theme === "dark" ? "🌙" : "☀️";
            }
        }

        const savedTheme = localStorage.getItem(THEME_KEY);

        applyTheme(
            savedTheme === "dark" || savedTheme === "light"
                ? savedTheme
                : (
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light"
                )
        );

        document.getElementById("themeToggle").addEventListener("click", function () {
            const current =
                document.documentElement.getAttribute("data-theme");

            const next = current === "dark" ? "light" : "dark";

            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
        });
    </script>

</body>

</html>
